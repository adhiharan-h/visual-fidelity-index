<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="vfiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="vfiCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Bold Diamond (Fills 88% of canvas for maximum size & punch) -->
  <polygon points="96,12 180,96 96,180 12,96" fill="url(#vfiCore)" stroke="url(#vfiGrad)" stroke-width="12" stroke-linejoin="round"/>
  
  <!-- Inner Dark Iris / Viewport -->
  <polygon points="96,44 148,96 96,148 44,96" fill="#090d16" stroke="url(#vfiGrad)" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Center Vibrant Reticle Diamond -->
  <polygon points="96,68 124,96 96,124 68,96" fill="url(#vfiGrad)"/>
</svg>
